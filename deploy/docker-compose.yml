# Môi trường pilot: một máy chủ đặt tại Việt Nam. Chạy từ thư mục gốc repo:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: tax-pilot

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?}
      POSTGRES_DB: tax
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d tax"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: .., dockerfile: backend/Dockerfile }
    environment:
      ADMIN_DATABASE_URL: postgresql://owner:${OWNER_DB_PASSWORD}@db/tax
    command: ["python", "-m", "app.cli", "migrate"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  backend:
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment: &backend_env
      DATABASE_URL: postgresql://tax_app_login:${APP_DB_PASSWORD}@db/tax
      ADMIN_DATABASE_URL: postgresql://owner:${OWNER_DB_PASSWORD}@db/tax
      STORAGE_DIR: /data/storage
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      FOREIGN_AI_ENABLED: "false"
      SESSION_HOURS: ${SESSION_HOURS:-12}
    volumes:
      - storage:/data/storage
      - backups:/data/backups
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment: *backend_env
    command: ["python", "-m", "app.worker"]
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    build: { context: ../frontend, args: { BACKEND_URL: "http://backend:8000" } }
    restart: unless-stopped
    depends_on: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [frontend]

volumes:
  pgdata:
  storage:
  backups:
  caddy:
